name: Android Build

on:
  push:
    branches: [main, 'hotfix/**', 'ui/**', 'release/**', 'chore/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: No automatic USB wiring regression
        run: python3 scripts/check_hotfix.py

      - name: Responsive layout structure guard
        run: python3 scripts/check_layouts.py

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Decode production keystore (if configured)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "ANDROID_KEYSTORE_FILE=release.keystore" >> "$GITHUB_ENV"
            echo "Production keystore decoded (contents never logged)."
          else
            echo "No production keystore secret configured — release APK will be UNSIGNED."
          fi

      - name: Build release APK (unsigned unless secrets present)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Remove decoded keystore
        if: always()
        run: rm -f release.keystore

      - name: Verify APK identity and pinned signature
        run: python3 scripts/verify_apk.py

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: G102-verification-reports
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/lint-results-debug.*
            app/build/reports/hotfix-apk.txt

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: G102-Controller-beta-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: G102-Controller-release
          path: app/build/outputs/apk/release/*.apk
