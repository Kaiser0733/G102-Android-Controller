name: Android Build

on:
  push:
    branches: [main, 'hotfix/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: No automatic USB wiring regression
        run: python3 scripts/check_hotfix.py

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK identity and pinned signature
        run: python3 scripts/verify_apk.py

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: G102-verification-reports
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/lint-results-debug.*
            app/build/reports/hotfix-apk.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: G102-Controller-debug
          path: app/build/outputs/apk/debug/*.apk
