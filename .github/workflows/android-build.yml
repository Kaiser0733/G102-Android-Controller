name: Android Build

on:
  push:
    branches: [main, 'hotfix/**', 'ui/**', 'release/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: No automatic USB wiring regression
        run: python3 scripts/check_hotfix.py

      - name: Responsive layout structure guard
        run: python3 scripts/check_layouts.py

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK (unsigned unless secrets present)
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK identity and pinned signature
        run: python3 scripts/verify_apk.py

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: G102-verification-reports
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/lint-results-debug.*
            app/build/reports/hotfix-apk.txt

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: G102-Controller-beta-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: G102-Controller-release
          path: app/build/outputs/apk/release/*.apk
